# Add Beacon to the Cloudflare Tunnel you already run.
# Merge the wiki hostname into /etc/cloudflared/config.yml *above* the catch-all rule,
# then: sudo systemctl restart cloudflared
#
# If cloudflared runs in a different container than Beacon, replace 127.0.0.1
# with the Beacon container's LAN IP and set BEACON_HOST=0.0.0.0 in beacon.service.

tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: wiki.example.com
    service: http://127.0.0.1:3000
  # ...your existing rules (for example Lighthouse) stay here...
  - service: http_status:404
